name: Announce MCQ of the day

on:
  push:
    branches: [master]
    paths: [mcq.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = only log, send nothing"
        required: false
        default: "false"

concurrency:
  group: mcq-notify
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@12
      - name: Announce
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/mcq-notify.mjs
