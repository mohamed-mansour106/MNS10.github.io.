name: Switch quiz result email to Apps Script

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = only count, change nothing"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/checkout@v4
        with:
          ref: main
          path: tools-main
      - name: Switch quiz scripts
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python3 tools-main/.github/switch-quiz-mail.py dry; else python3 tools-main/.github/switch-quiz-mail.py; fi
      - name: Commit
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branchsites
          if git diff --cached --quiet; then echo "Nothing to commit"; else git commit -m "Quiz result email: switch course quizzes to Google Apps Script mailer" && git push origin HEAD:refs/heads/master; fi
