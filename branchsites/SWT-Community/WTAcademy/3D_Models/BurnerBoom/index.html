
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Well Testing Academy - Interactive Burner Boom</title>

<style>
:root {
    --accent: #00ffcc;
    --bg: rgba(10,10,10,0.96);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

canvas {
    display: block;
}

/* Header */
#top-panel {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 18px;
    pointer-events: none;
}

#top-panel h3 {
    margin: 0;
    color: var(--accent);
    font-size: 15px;
}

#top-panel p {
    margin: 5px 0 0;
    font-size: 11px;
    color: #aaa;
}

/* Camera */
#cam-overlay {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 20;
}

button {
    cursor: pointer;
    font-weight: bold;
}

#cam-overlay button {
    background: #222;
    color: white;
    border: 1px solid var(--accent);
    padding: 10px 15px;
    border-radius: 6px;
}

/* Hotspot layer */
#hotspot-layer {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    overflow: hidden;
}

/* Individual Hotspots */
.hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: none;
    background: transparent;
    color: white;
    padding: 5px;
    white-space: nowrap;
}

.hotspot-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid white;
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.5s infinite;
}

.hotspot-label {
    margin-top: 5px;
    background: rgba(0,0,0,0.85);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 4px 7px;
    font-size: 10px;
}

.hotspot:hover .hotspot-dot {
    background: #fff;
    transform: scale(1.3);
}

@keyframes pulse {
    0% { box-shadow: 0 0 5px var(--accent); }
    50% { box-shadow: 0 0 18px var(--accent); }
    100% { box-shadow: 0 0 5px var(--accent); }
}

/* Information Popup */
#info-popup {
    display: none;
    position: absolute;
    z-index: 100;
    width: min(420px, calc(100% - 30px));
    max-height: 75vh;
    overflow-y: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(12,18,22,0.98);
    border: 1px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 0 35px rgba(0,255,204,0.2);
    padding: 22px;
}

#popup-close {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    background: #c62828;
    color: white;
    font-size: 20px;
}

#popup-title {
    color: var(--accent);
    font-size: 19px;
    margin: 5px 35px 15px 0;
    border-bottom: 1px solid #333;
    padding-bottom: 12px;
}

.popup-section {
    margin-bottom: 15px;
}

.popup-section h4 {
    color: var(--accent);
    font-size: 12px;
    margin: 0 0 6px;
    text-transform: uppercase;
}

.popup-section p {
    color: #ddd;
    font-size: 13px;
    line-height: 1.7;
    margin: 0;
}

#popup-tag {
    display: inline-block;
    background: rgba(0,255,204,0.1);
    color: var(--accent);
    border: 1px solid #087b68;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 10px;
    margin-bottom: 12px;
}

/* Bottom dashboard */
#dashboard {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 75px;
    z-index: 10;
    background: var(--bg);
    border-top: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px;
}

.dash-section {
    text-align: center;
}

.dash-section h4 {
    color: var(--accent);
    margin: 0 0 5px;
    font-size: 11px;
}

.dash-section p {
    color: #aaa;
    margin: 0;
    font-size: 10px;
}

@media(max-width:600px) {
    #top-panel {
        top: 10px;
        left: 10px;
        padding: 8px;
    }

    #top-panel h3 {
        font-size: 11px;
    }

    #top-panel p {
        font-size: 9px;
    }

    #cam-overlay {
        top: 10px;
        right: 10px;
    }

    #cam-overlay button {
        padding: 8px;
        font-size: 10px;
    }

    #dashboard {
        height: 65px;
    }

    #info-popup {
        padding: 18px;
    }

    #popup-title {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- Header -->
<div id="top-panel">
    <h3>WELL TESTING ACADEMY</h3>
    <p>Interactive Burner Boom Training</p>
</div>

<!-- Camera -->
<div id="cam-overlay">
    <button onclick="resetCamera()">Reset Camera</button>
</div>

<!-- Hotspots -->
<div id="hotspot-layer"></div>

<!-- Information Popup -->
<div id="info-popup">

    <button id="popup-close" onclick="closePopup()">×</button>

    <div id="popup-tag">WELLHEAD COMPONENT</div>

    <h2 id="popup-title">Component Name</h2>

    <div class="popup-section">
        <h4>Function</h4>
        <p id="popup-function"></p>
    </div>

    <div class="popup-section">
        <h4>Working Principle</h4>
        <p id="popup-working"></p>
    </div>

    <div class="popup-section">
        <h4>Operational Importance</h4>
        <p id="popup-importance"></p>
    </div>

</div>

<!-- Dashboard -->
<div id="dashboard">

    <div class="dash-section">
        <h4>3D MODEL</h4>
        <p>Burner Boom Equipment</p>
    </div>
    
    <div class="dash-section">
        <h4>INTERACTIVE POINTS</h4>
        <p>Click a green marker to learn more</p>
    </div>
    
    <div class="dash-section">
        <h4>CAMERA</h4>
        <p>Drag to rotate | Scroll to zoom</p>
    </div>

</div>

<!-- Three.js Libraries -->
<script src="../../../simulator/three.min.js"></script>
<script src="../../../simulator/GLTFLoader.js"></script>
<script src="../../../simulator/OrbitControls.js"></script>



<script>

let scene, camera, renderer, controls;
let wellhead = null;

const hotspotLayer = document.getElementById("hotspot-layer");

let hotspotObjects = [];

/*
 IMPORTANT:
 These positions are normalized coordinates within
 the loaded model's bounding box.

 Adjust x, y, z to place each marker accurately
 on your particular wellhead.glb model.
*/


const components = [

    {
        id: 1,
        name: "Burner Tip / Flare Tip",
        x: 0.90, y: 0.85, z: 0.50,
        function:
        "The burner tip is located at the end of the burner boom. It provides the outlet where produced gas is discharged and burned.",
        working:
        "Gas exits through the burner tip and is ignited using the installed ignition system. The flame burns the gas in a controlled location away from the main well testing equipment.",
        importance:
        "Provides a controlled disposal point for gas during well testing operations."
    },

    {
        id: 2,
        name: "Ignition System",
        x: 0.85, y: 0.80, z: 0.55,
        function:
        "The ignition system provides the means to ignite gas discharged from the burner tip.",
        working:
        "Depending on the design, ignition may use a pilot burner, electrical ignition, or another approved ignition arrangement.",
        importance:
        "Ensures controlled ignition and helps prevent unignited gas release. Ignition must follow the approved operating procedure."
    },

    {
        id: 3,
        name: "Burner Boom Pipe",
        x: 0.55, y: 0.55, z: 0.50,
        function:
        "The burner boom pipe carries gas from the inlet connection toward the burner tip.",
        working:
        "Gas flows through the internal passage of the boom and exits at the flare tip.",
        importance:
        "Provides the flow path for gas disposal at a designated safe location."
    },

    {
        id: 4,
        name: "Support Structure",
        x: 0.50, y: 0.40, z: 0.50,
        function:
        "The support structure carries the mechanical load of the burner boom.",
        working:
        "It supports the boom and helps maintain its designed position during operation.",
        importance:
        "Maintains structural stability and reduces the risk of unwanted movement."
    },

    {
        id: 5,
        name: "Guy Wires",
        x: 0.45, y: 0.25, z: 0.30,
        function:
        "Guy wires are tensioned cables used to stabilize the burner boom.",
        working:
        "They transfer lateral forces from the boom to suitable anchor points, helping resist movement caused by wind and other loads.",
        importance:
        "Help maintain boom stability. Their condition and tension must be checked according to the approved procedure."
    },

    {
        id: 6,
        name: "Anchor Points",
        x: 0.25, y: 0.10, z: 0.30,
        function:
        "Anchor points secure the guy wires or other supporting members to the ground or designated foundation.",
        working:
        "They transfer the tension and supporting forces into the ground or engineered anchoring system.",
        importance:
        "Prevent unwanted movement and support the overall stability of the installation."
    },

    {
        id: 7,
        name: "Base / Pivot Point",
        x: 0.15, y: 0.30, z: 0.50,
        function:
        "The base provides the main supporting interface for the burner boom. Some designs include a pivot arrangement.",
        working:
        "It transfers the boom loads to the supporting foundation and may allow controlled positioning where the design permits.",
        importance:
        "Provides a stable foundation and supports safe boom positioning."
    },

    {
        id: 8,
        name: "Gas Inlet Connection",
        x: 0.10, y: 0.45, z: 0.50,
        function:
        "The gas inlet connection receives gas from the designated upstream well testing flowline or piping system.",
        working:
        "Gas enters the burner boom through the designed connection and travels toward the burner tip.",
        importance:
        "Connects the burner boom to the gas disposal system. Pressure rating, isolation and connection integrity are critical."
    }

];



/* Initialize Scene */

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x050505);

    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        3000
    );

    camera.position.set(-5, 15, 25);

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);


    /* Camera Controls */

    controls = new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    controls.rotateSpeed = 1.8;
    controls.zoomSpeed = 2;

    controls.minDistance = 3;
    controls.maxDistance = 100;

    controls.enableRotate = true;
    controls.enableZoom = true;
    controls.enablePan = true;

    controls.maxPolarAngle = Math.PI / 2.05;

    controls.target.set(-25, 5, 0.5);

    controls.update();


    /* Lighting */

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        )
    );

    const sun = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    sun.position.set(50, 100, 50);

    scene.add(sun);


    /* Grid */

    scene.add(
        new THREE.GridHelper(
            200,
            40,
            0x333333,
            0x151515
        )
    );


    /* Load Wellhead */

    loadWellhead();

    animate();

}


/* Load GLB Model */

function loadWellhead() {

const loader = new THREE.GLTFLoader();

loader.load(
    '../../../simulator/burnerboom.glb',

    function(gltf) {

        wellhead = gltf.scene;

        wellhead.position.set(-25, 0, 0.5);

        wellhead.scale.set(7, 7, 7);

        wellhead.name = "Burner Boom";

        wellhead.traverse(function(child) {

            if(child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
            }

        });

        scene.add(wellhead);

        const box = new THREE.Box3().setFromObject(wellhead);

        const center = box.getCenter(new THREE.Vector3());

        const size = box.getSize(new THREE.Vector3());

        controls.target.copy(center);

        const maxDimension = Math.max(size.x, size.y, size.z);

        camera.position.set(
            center.x + maxDimension * 0.9,
            center.y + maxDimension * 0.6,
            center.z + maxDimension * 1.2
        );

        controls.update();

        createHotspots(box);

        console.log("Burner Boom loaded successfully");

    },

    undefined,

    function(error) {
        console.error("Error loading burnerboom.glb", error);
    }
);

}


/* Create Hotspots */

function createHotspots(box) {

    hotspotLayer.innerHTML = "";

    hotspotObjects = [];

    components.forEach(component => {

        const marker = document.createElement("button");

        marker.className = "hotspot";

        marker.innerHTML = `
            <span class="hotspot-dot"></span>
            <span class="hotspot-label">${component.name}</span>
        `;

        marker.title = component.name;

        marker.addEventListener("click", function(e) {

            e.stopPropagation();

            openPopup(component);

        });

        hotspotLayer.appendChild(marker);

        // Convert normalized coordinates to world coordinates
        const position = new THREE.Vector3(
            box.min.x + (box.max.x - box.min.x) * component.x,
            box.min.y + (box.max.y - box.min.y) * component.y,
            box.min.z + (box.max.z - box.min.z) * component.z
        );

        hotspotObjects.push({
            element: marker,
            position: position
        });

    });

}


/* Update Marker Positions Every Frame */

function updateHotspots() {

    if(!wellhead) return;

    const width = window.innerWidth;
    const height = window.innerHeight;

    hotspotObjects.forEach(hotspot => {

        const projected = hotspot.position.clone();

        projected.project(camera);

        const x = (projected.x * 0.5 + 0.5) * width;

        const y = (-projected.y * 0.5 + 0.5) * height;

        const visible =
            projected.z > -1 &&
            projected.z < 1 &&
            x > 0 &&
            x < width &&
            y > 0 &&
            y < height;

        hotspot.element.style.display =
            visible ? "flex" : "none";

        if(visible) {

            hotspot.element.style.left = x + "px";

            hotspot.element.style.top = y + "px";

        }

    });

}


/* Open Popup */

function openPopup(component) {

    document.getElementById("popup-title").innerText =
        component.name;

    document.getElementById("popup-function").innerText =
        component.function;

    document.getElementById("popup-working").innerText =
        component.working;

    document.getElementById("popup-importance").innerText =
        component.importance;

    document.getElementById("info-popup").style.display =
        "block";

}


/* Close Popup */

function closePopup() {

    document.getElementById("info-popup").style.display =
        "none";

}


/* Reset Camera */

function resetCamera() {

if(!wellhead) return;

const box = new THREE.Box3().setFromObject(wellhead);

const center = box.getCenter(new THREE.Vector3());

const size = box.getSize(new THREE.Vector3());

const maxDimension = Math.max(size.x, size.y, size.z);

controls.target.copy(center);

camera.position.set(
    center.x + maxDimension * 0.9,
    center.y + maxDimension * 0.6,
    center.z + maxDimension * 1.2
);

controls.update();

}


/* Animation */

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    updateHotspots();

    renderer.render(scene, camera);

}


/* Responsive */

window.addEventListener("resize", function() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


/* Close popup with Escape */

window.addEventListener("keydown", function(event) {

    if(event.key === "Escape") {
        closePopup();
    }

});


window.onload = init;

</script>

</body>
</html>
