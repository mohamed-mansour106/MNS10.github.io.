
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Well Testing Academy - Interactive Choke Manifold</title>

<style>
:root {
    --accent: #00ffcc;
    --bg: rgba(10,10,10,0.96);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

canvas {
    display: block;
}

/* Header */
#top-panel {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 18px;
    pointer-events: none;
}

#top-panel h3 {
    margin: 0;
    color: var(--accent);
    font-size: 15px;
}

#top-panel p {
    margin: 5px 0 0;
    font-size: 11px;
    color: #aaa;
}

/* Camera */
#cam-overlay {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 20;
}

button {
    cursor: pointer;
    font-weight: bold;
}

#cam-overlay button {
    background: #222;
    color: white;
    border: 1px solid var(--accent);
    padding: 10px 15px;
    border-radius: 6px;
}

/* Hotspot layer */
#hotspot-layer {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    overflow: hidden;
}

/* Individual Hotspots */
.hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: none;
    background: transparent;
    color: white;
    padding: 5px;
    white-space: nowrap;
}

.hotspot-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid white;
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.5s infinite;
}

.hotspot-label {
    margin-top: 5px;
    background: rgba(0,0,0,0.85);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 4px 7px;
    font-size: 10px;
}

.hotspot:hover .hotspot-dot {
    background: #fff;
    transform: scale(1.3);
}

@keyframes pulse {
    0% { box-shadow: 0 0 5px var(--accent); }
    50% { box-shadow: 0 0 18px var(--accent); }
    100% { box-shadow: 0 0 5px var(--accent); }
}

/* Information Popup */
#info-popup {
    display: none;
    position: absolute;
    z-index: 100;
    width: min(420px, calc(100% - 30px));
    max-height: 75vh;
    overflow-y: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(12,18,22,0.98);
    border: 1px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 0 35px rgba(0,255,204,0.2);
    padding: 22px;
}

#popup-close {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    background: #c62828;
    color: white;
    font-size: 20px;
}

#popup-title {
    color: var(--accent);
    font-size: 19px;
    margin: 5px 35px 15px 0;
    border-bottom: 1px solid #333;
    padding-bottom: 12px;
}

.popup-section {
    margin-bottom: 15px;
}

.popup-section h4 {
    color: var(--accent);
    font-size: 12px;
    margin: 0 0 6px;
    text-transform: uppercase;
}

.popup-section p {
    color: #ddd;
    font-size: 13px;
    line-height: 1.7;
    margin: 0;
}

#popup-tag {
    display: inline-block;
    background: rgba(0,255,204,0.1);
    color: var(--accent);
    border: 1px solid #087b68;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 10px;
    margin-bottom: 12px;
}

/* Bottom dashboard */
#dashboard {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 75px;
    z-index: 10;
    background: var(--bg);
    border-top: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px;
}

.dash-section {
    text-align: center;
}

.dash-section h4 {
    color: var(--accent);
    margin: 0 0 5px;
    font-size: 11px;
}

.dash-section p {
    color: #aaa;
    margin: 0;
    font-size: 10px;
}

@media(max-width:600px) {
    #top-panel {
        top: 10px;
        left: 10px;
        padding: 8px;
    }

    #top-panel h3 {
        font-size: 11px;
    }

    #top-panel p {
        font-size: 9px;
    }

    #cam-overlay {
        top: 10px;
        right: 10px;
    }

    #cam-overlay button {
        padding: 8px;
        font-size: 10px;
    }

    #dashboard {
        height: 65px;
    }

    #info-popup {
        padding: 18px;
    }

    #popup-title {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- Header -->
<div id="top-panel">
    <h3>WELL TESTING ACADEMY</h3>
    <p>Interactive Choke Manifold Training</p>
</div>

<!-- Camera -->
<div id="cam-overlay">
    <button onclick="resetCamera()">Reset Camera</button>
</div>

<!-- Hotspots -->
<div id="hotspot-layer"></div>

<!-- Information Popup -->
<div id="info-popup">

    <button id="popup-close" onclick="closePopup()">×</button>

    <div id="popup-tag">CHOKE MANIFOLD COMPONENT</div>

    <h2 id="popup-title">Component Name</h2>

    <div class="popup-section">
        <h4>Function</h4>
        <p id="popup-function"></p>
    </div>

    <div class="popup-section">
        <h4>Working Principle</h4>
        <p id="popup-working"></p>
    </div>

    <div class="popup-section">
        <h4>Operational Importance</h4>
        <p id="popup-importance"></p>
    </div>

</div>

<!-- Dashboard -->
<div id="dashboard">

    <div class="dash-section">
        <h4>3D MODEL</h4>
        <p>Choke Manifold Equipment</p>
    </div>

    <div class="dash-section">
        <h4>INTERACTIVE POINTS</h4>
        <p>Click a green marker to learn more</p>
    </div>

    <div class="dash-section">
        <h4>CAMERA</h4>
        <p>Drag to rotate | Scroll to zoom</p>
    </div>

</div>

<!-- Three.js Libraries -->
<script src="../../../simulator/three.min.js"></script>
<script src="../../../simulator/GLTFLoader.js"></script>
<script src="../../../simulator/OrbitControls.js"></script>

<script>

let scene, camera, renderer, controls;
let chokeManifold = null;

const hotspotLayer = document.getElementById("hotspot-layer");

let hotspotObjects = [];

/*
 IMPORTANT:
 These positions are estimated normalized coordinates
 within the loaded chokemanifold.glb bounding box.

 Adjust x, y, z according to your actual 3D model.
*/

const components = [

    {
        id: 1,
        name: "Inlet Connection",
        x: 0.15, y: 0.50, z: 1,

        function:
        "The inlet connection receives well fluids from the upstream flowline and directs them into the choke manifold.",

        working:
        "The incoming production stream enters the manifold through a pressure-rated connection before being routed through the selected flow path.",

        importance:
        "Provides the main connection between the well testing flowline and the choke manifold. Connection integrity and pressure rating are essential."
    },

    {
        id: 2,
        name: "Inlet Isolation Valve",
        x: 0.25, y: 0.90, z: 0.50,

        function:
        "The inlet isolation valve is used to isolate the choke manifold from the upstream well flowline.",

        working:
        "The valve opens or closes the flow passage using its operating mechanism. It is operated according to the approved operating procedure.",

        importance:
        "Allows controlled isolation of the manifold for approved operational activities and maintenance."
    },

    {
        id: 3,
        name: "Adjustable Choke",
        x: 0.9, y: 0.35, z: 0.9,

        function:
        "The adjustable choke controls the flow rate and reduces pressure across the choke by changing the effective flow opening.",

        working:
        "The choke operator moves the internal stem and plug or needle relative to the seat. This changes the flow area and controls the pressure drop.",

        importance:
        "Allows the operator to regulate well flow and manage downstream pressure during well testing."
    },

    {
        id: 4,
        name: "Fixed Choke",
        x: 0.15, y: 0.35, z: 0,

        function:
        "The fixed choke provides a selected, non-adjustable flow restriction using a replaceable choke bean or orifice.",

        working:
        "Fluids pass through a fixed-size opening. The selected bean size determines the restriction, while actual flow and pressure drop depend on operating conditions.",

        importance:
        "Provides a consistent restriction for controlled well testing operations. Bean selection must consider expected flow, pressure and erosion."
    },

    {
        id: 5,
        name: "Bypass Valve",
        x: 0.50, y: 0.40, z: 0.50,

        function:
        "The bypass valve provides an alternative flow path around the choke arrangement in manifold designs equipped with a bypass line.",

        working:
        "When the designed bypass path is opened, fluids can pass through that path instead of the normal choke restriction.",

        importance:
        "Provides an alternative flow path for specific approved operating configurations. It must only be operated according to the manifold procedure."
    },

    {
        id: 6,
        name: "DownStream Adjustable Choke",
        x: 0.85, y: 0.90, z: 0.50,

        function:
        "The outlet isolation valve isolates the downstream flowline or production system from the choke manifold.",

        working:
        "The valve opens or closes the downstream flow passage to control communication between the manifold and the connected system.",

        importance:
        "Allows controlled isolation of downstream equipment and supports safe system operation."
    },

    {
        id: 7,
        name: "Pressure Gauge / Transmitter",
        x: 0.75, y: 0.50, z: 0.25,

        function:
        "The pressure gauge or pressure transmitter measures pressure at its designated point in the choke manifold.",

        working:
        "A pressure gauge provides a local reading, while a pressure transmitter converts the measured pressure into a signal for a monitoring or control system.",

        importance:
        "Allows operators to monitor pressure conditions and identify abnormal pressure changes during well testing."
    },

    {
        id: 8,
        name: "Choke Manifold Outlet",
        x: 0.95, y: 0.50, z: 0.1,

        function:
        "The choke manifold outlet directs controlled fluids toward the downstream flowline or designated well testing equipment.",

        working:
        "After passing through the selected manifold flow path, fluids leave through the outlet connection and continue to the next part of the system.",

        importance:
        "Provides the downstream connection for controlled well fluid routing."
    },

    {
        id: 9,
        name: " Outlet Isolation Valve",
        x: 0.5, y: 0.90, z: 0.2,

        function:
        "The outlet isolation valve isolates the downstream flowline or production system from the choke manifold.",

        working:
        "The valve opens or closes the downstream flow passage to control communication between the manifold and the connected system.",

        importance:
        "Allows controlled isolation of downstream equipment and supports safe system operation."
    },

    {
        id: 10,
        name: "Upstream Adjustable Choke",
        x: 0.50, y: 0.90, z: 0.85,

        function:
        "The inlet isolation valve is used to isolate the choke manifold from the upstream well flowline.",

        working:
        "The valve opens or closes the flow passage using its operating mechanism. It is operated according to the approved operating procedure.",

        importance:
        "Allows controlled isolation of the manifold for approved operational activities and maintenance."
    },

];


/* Initialize Scene */

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x050505);

    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        3000
    );

    camera.position.set(-5, 15, 25);

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);


    /* Camera Controls */

    controls = new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    controls.rotateSpeed = 1.8;
    controls.zoomSpeed = 2;

    controls.minDistance = 3;
    controls.maxDistance = 150;

    controls.enableRotate = true;
    controls.enableZoom = true;
    controls.enablePan = true;

    controls.maxPolarAngle = Math.PI / 2.05;

    controls.target.set(-25, 5, 0.5);

    controls.update();


    /* Lighting */

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        )
    );

    const sun = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    sun.position.set(50, 100, 50);

    scene.add(sun);


    /* Grid */

    scene.add(
        new THREE.GridHelper(
            200,
            40,
            0x333333,
            0x151515
        )
    );


    /* Load Choke Manifold */

    loadChokeManifold();

    animate();

}


/* Load GLB Model */

function loadChokeManifold() {

    const loader = new THREE.GLTFLoader();

    loader.load(
        '../../../simulator/chokemanifold.glb',

        function(gltf) {

            chokeManifold = gltf.scene;

            chokeManifold.position.set(-25, 0, 0.5);

            chokeManifold.scale.set(7, 7, 7);

            chokeManifold.name = "Choke Manifold";

            chokeManifold.traverse(function(child) {

                if(child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }

            });

            scene.add(chokeManifold);

            // Calculate actual model dimensions
            const box = new THREE.Box3().setFromObject(chokeManifold);

            const center = box.getCenter(new THREE.Vector3());

            const size = box.getSize(new THREE.Vector3());

            // Calculate camera distance based on model dimensions
            const maxDimension = Math.max(size.x, size.y, size.z);

            controls.target.copy(center);

            camera.position.set(
                center.x + maxDimension * 1.1,
                center.y + maxDimension * 0.75,
                center.z + maxDimension * 1.4
            );

            controls.update();

            // Create interactive markers
            createHotspots(box);

            console.log("Choke Manifold loaded successfully");

        },

        undefined,

        function(error) {

            console.error("Error loading chokemanifold.glb", error);

        }
    );

}


/* Create Hotspots */

function createHotspots(box) {

    hotspotLayer.innerHTML = "";

    hotspotObjects = [];

    components.forEach(component => {

        const marker = document.createElement("button");

        marker.className = "hotspot";

        marker.innerHTML = `
            <span class="hotspot-dot"></span>
            <span class="hotspot-label">${component.name}</span>
        `;

        marker.title = component.name;

        marker.addEventListener("click", function(e) {

            e.stopPropagation();

            openPopup(component);

        });

        hotspotLayer.appendChild(marker);

        // Convert normalized coordinates to world coordinates
        const position = new THREE.Vector3(
            box.min.x + (box.max.x - box.min.x) * component.x,
            box.min.y + (box.max.y - box.min.y) * component.y,
            box.min.z + (box.max.z - box.min.z) * component.z
        );

        hotspotObjects.push({
            element: marker,
            position: position
        });

    });

}


/* Update Marker Positions Every Frame */

function updateHotspots() {

    if(!chokeManifold) return;

    const width = window.innerWidth;
    const height = window.innerHeight;

    hotspotObjects.forEach(hotspot => {

        const projected = hotspot.position.clone();

        projected.project(camera);

        const x = (projected.x * 0.5 + 0.5) * width;

        const y = (-projected.y * 0.5 + 0.5) * height;

        const visible =
            projected.z > -1 &&
            projected.z < 1 &&
            x > 0 &&
            x < width &&
            y > 0 &&
            y < height;

        hotspot.element.style.display =
            visible ? "flex" : "none";

        if(visible) {

            hotspot.element.style.left = x + "px";

            hotspot.element.style.top = y + "px";

        }

    });

}


/* Open Popup */

function openPopup(component) {

    document.getElementById("popup-title").innerText =
        component.name;

    document.getElementById("popup-function").innerText =
        component.function;

    document.getElementById("popup-working").innerText =
        component.working;

    document.getElementById("popup-importance").innerText =
        component.importance;

    document.getElementById("info-popup").style.display =
        "block";

}


/* Close Popup */

function closePopup() {

    document.getElementById("info-popup").style.display =
        "none";

}


/* Reset Camera */

function resetCamera() {

    if(!chokeManifold) return;

    const box = new THREE.Box3().setFromObject(chokeManifold);

    const center = box.getCenter(new THREE.Vector3());

    const size = box.getSize(new THREE.Vector3());

    const maxDimension = Math.max(size.x, size.y, size.z);

    controls.target.copy(center);

    camera.position.set(
        center.x + maxDimension * 1.1,
        center.y + maxDimension * 0.75,
        center.z + maxDimension * 1.4
    );

    controls.update();

}


/* Animation */

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    updateHotspots();

    renderer.render(scene, camera);

}


/* Responsive */

window.addEventListener("resize", function() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


/* Close popup with Escape */

window.addEventListener("keydown", function(event) {

    if(event.key === "Escape") {
        closePopup();
    }

});


window.onload = init;

</script>

</body>
</html>
