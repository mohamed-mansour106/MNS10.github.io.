
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Well Testing Academy - Interactive Wellhead</title>

<style>
:root {
    --accent: #00ffcc;
    --bg: rgba(10,10,10,0.96);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

canvas {
    display: block;
}

/* Header */
#top-panel {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 18px;
    pointer-events: none;
}

#top-panel h3 {
    margin: 0;
    color: var(--accent);
    font-size: 15px;
}

#top-panel p {
    margin: 5px 0 0;
    font-size: 11px;
    color: #aaa;
}

/* Camera */
#cam-overlay {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 20;
}

button {
    cursor: pointer;
    font-weight: bold;
}

#cam-overlay button {
    background: #222;
    color: white;
    border: 1px solid var(--accent);
    padding: 10px 15px;
    border-radius: 6px;
}

/* Hotspot layer */
#hotspot-layer {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    overflow: hidden;
}

/* Individual Hotspots */
.hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: none;
    background: transparent;
    color: white;
    padding: 5px;
    white-space: nowrap;
}

.hotspot-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid white;
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.5s infinite;
}

.hotspot-label {
    margin-top: 5px;
    background: rgba(0,0,0,0.85);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 4px 7px;
    font-size: 10px;
}

.hotspot:hover .hotspot-dot {
    background: #fff;
    transform: scale(1.3);
}

@keyframes pulse {
    0% { box-shadow: 0 0 5px var(--accent); }
    50% { box-shadow: 0 0 18px var(--accent); }
    100% { box-shadow: 0 0 5px var(--accent); }
}

/* Information Popup */
#info-popup {
    display: none;
    position: absolute;
    z-index: 100;
    width: min(420px, calc(100% - 30px));
    max-height: 75vh;
    overflow-y: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(12,18,22,0.98);
    border: 1px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 0 35px rgba(0,255,204,0.2);
    padding: 22px;
}

#popup-close {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    background: #c62828;
    color: white;
    font-size: 20px;
}

#popup-title {
    color: var(--accent);
    font-size: 19px;
    margin: 5px 35px 15px 0;
    border-bottom: 1px solid #333;
    padding-bottom: 12px;
}

.popup-section {
    margin-bottom: 15px;
}

.popup-section h4 {
    color: var(--accent);
    font-size: 12px;
    margin: 0 0 6px;
    text-transform: uppercase;
}

.popup-section p {
    color: #ddd;
    font-size: 13px;
    line-height: 1.7;
    margin: 0;
}

#popup-tag {
    display: inline-block;
    background: rgba(0,255,204,0.1);
    color: var(--accent);
    border: 1px solid #087b68;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 10px;
    margin-bottom: 12px;
}

/* Bottom dashboard */
#dashboard {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 75px;
    z-index: 10;
    background: var(--bg);
    border-top: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px;
}

.dash-section {
    text-align: center;
}

.dash-section h4 {
    color: var(--accent);
    margin: 0 0 5px;
    font-size: 11px;
}

.dash-section p {
    color: #aaa;
    margin: 0;
    font-size: 10px;
}

@media(max-width:600px) {
    #top-panel {
        top: 10px;
        left: 10px;
        padding: 8px;
    }

    #top-panel h3 {
        font-size: 11px;
    }

    #top-panel p {
        font-size: 9px;
    }

    #cam-overlay {
        top: 10px;
        right: 10px;
    }

    #cam-overlay button {
        padding: 8px;
        font-size: 10px;
    }

    #dashboard {
        height: 65px;
    }

    #info-popup {
        padding: 18px;
    }

    #popup-title {
        font-size: 16px;
    }
}
</style>
<script data-goatcounter="https://ofu-mansour.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>

<!-- Header -->
<div id="top-panel">
    <h3>WELL TESTING ACADEMY</h3>
    <p>Interactive Wellhead Training</p>
</div>

<!-- Camera -->
<div id="cam-overlay">
    <button onclick="resetCamera()">Reset Camera</button>
</div>

<!-- Hotspots -->
<div id="hotspot-layer"></div>

<!-- Information Popup -->
<div id="info-popup">

    <button id="popup-close" onclick="closePopup()">×</button>

    <div id="popup-tag">WELLHEAD COMPONENT</div>

    <h2 id="popup-title">Component Name</h2>

    <div class="popup-section">
        <h4>Function</h4>
        <p id="popup-function"></p>
    </div>

    <div class="popup-section">
        <h4>Working Principle</h4>
        <p id="popup-working"></p>
    </div>

    <div class="popup-section">
        <h4>Operational Importance</h4>
        <p id="popup-importance"></p>
    </div>

</div>

<!-- Dashboard -->
<div id="dashboard">

    <div class="dash-section">
        <h4>3D MODEL</h4>
        <p>Wellhead Equipment</p>
    </div>

    <div class="dash-section">
        <h4>INTERACTIVE POINTS</h4>
        <p>Click a green marker to learn more</p>
    </div>

    <div class="dash-section">
        <h4>CAMERA</h4>
        <p>Drag to rotate | Scroll to zoom</p>
    </div>

</div>

<!-- Three.js Libraries -->
<script src="../../../simulator/three.min.js"></script>
<script src="../../../simulator/GLTFLoader.js"></script>
<script src="../../../simulator/OrbitControls.js"></script>



<script>

let scene, camera, renderer, controls;
let wellhead = null;

const hotspotLayer = document.getElementById("hotspot-layer");

let hotspotObjects = [];

/*
 IMPORTANT:
 These positions are normalized coordinates within
 the loaded model's bounding box.

 Adjust x, y, z to place each marker accurately
 on your particular wellhead.glb model.
*/

const components = [

    {
        id: 1,
        name: "Swab Valve",
        x: 0.25, y: 0.83, z: 0.290,
        function:
        "The swab valve is located at the top of the Christmas tree and provides access to the wellbore for wireline, slickline and other intervention operations.",
        working:
        "It is normally kept closed during production. When intervention is required, it can be opened under controlled pressure-management procedures.",
        importance:
        "Provides controlled vertical access to the well while maintaining pressure containment."
    },

    {
        id: 2,
        name: "Upper Master Valve",
        x: 0.2, y: 0.59, z: 0.50,
        function:
        "The upper master valve is a main isolation valve in the Christmas tree.",
        working:
        "It opens or closes the vertical production passage. It is operated according to the approved well operating procedure.",
        importance:
        "Provides an additional barrier for isolating the well."
    },

    {
        id: 3,
        name: "Lower Master Valve",
        x: 0.2, y: 0.37, z: 0.50,
        function:
        "The lower master valve is the primary production isolation valve in many Christmas tree configurations.",
        working:
        "It controls communication between the tubing and the tree production passage.",
        importance:
        "Provides a critical well-control and isolation barrier."
    },

    {
        id: 4,
        name: "Production Wing Valve",
        x: 0.50, y: 0.75, z: 0.50,
        function:
        "The production wing valve controls the flow of produced fluids from the Christmas tree into the production flowline.",
        working:
        "When open, production fluids pass through the wing outlet toward the downstream production equipment.",
        importance:
        "Allows the well to be connected or isolated from the production system."
    },

    {
        id: 5,
        name: "Kill Wing Valve",
        x: 0.05, y: 0.75, z: 0.50,
        function:
        "The kill wing valve provides access to the well for pumping fluids into the wellbore.",
        working:
        "It allows controlled injection of kill fluid or other approved fluids through the designated connection.",
        importance:
        "Supports well intervention and well-control operations."
    },

    {
        id: 6,
        name: "Tubing Head",
        x: 0.250, y: 0.250, z: 0.50,
        function:
        "The tubing head supports and seals the production tubing hanger.",
        working:
        "It provides a pressure-containing interface between the casing head assembly and the Christmas tree.",
        importance:
        "Supports the tubing hanger and maintains pressure integrity."
    },

    {
        id: 7,
        name: "Casing Head",
        x: 0.50, y: 0.10, z: 0.50,
        function:
        "The casing head is part of the wellhead assembly and supports the casing strings.",
        working:
        "It provides housing and sealing interfaces for casing hangers and associated wellhead equipment.",
        importance:
        "Supports casing loads and contributes to pressure containment."
    },

    {
        id: 8,
        name: "Production Outlet",
        x: 0.80, y: 0.750, z: 0.50,
        function:
        "The production outlet provides the connection between the Christmas tree and the production flowline.",
        working:
        "Produced oil, gas and water travel through the outlet toward the downstream production system.",
        importance:
        "Connects the well to the production or well-testing system."
    }

];


/* Initialize Scene */

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x050505);

    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        3000
    );

    camera.position.set(-5, 15, 25);

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);


    /* Camera Controls */

    controls = new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    controls.rotateSpeed = 1.8;
    controls.zoomSpeed = 2;

    controls.minDistance = 3;
    controls.maxDistance = 100;

    controls.enableRotate = true;
    controls.enableZoom = true;
    controls.enablePan = true;

    controls.maxPolarAngle = Math.PI / 2.05;

    controls.target.set(-25, 5, 0.5);

    controls.update();


    /* Lighting */

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        )
    );

    const sun = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    sun.position.set(50, 100, 50);

    scene.add(sun);


    /* Grid */

    scene.add(
        new THREE.GridHelper(
            200,
            40,
            0x333333,
            0x151515
        )
    );


    /* Load Wellhead */

    loadWellhead();

    animate();

}


/* Load GLB Model */

function loadWellhead() {

    const loader = new THREE.GLTFLoader();

    loader.load(
        '../../../simulator/wellhead.glb',

        function(gltf) {

            wellhead = gltf.scene;

            wellhead.position.set(-25, 0, 0.5);

            wellhead.scale.set(7, 7, 7);

            wellhead.name = "Wellhead";

            wellhead.traverse(function(child) {

                if(child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }

            });

            scene.add(wellhead);

            // Calculate actual model dimensions
            const box = new THREE.Box3().setFromObject(wellhead);

            const center = box.getCenter(new THREE.Vector3());

            // Focus camera on model
            controls.target.copy(center);

            camera.position.set(
                center.x + 12,
                center.y + 8,
                center.z + 15
            );

            controls.update();

            // Create interactive markers
            createHotspots(box);

            console.log("Wellhead loaded successfully");

        },

        undefined,

        function(error) {

            console.error("Error loading wellhead.glb", error);

        }
    );

}


/* Create Hotspots */

function createHotspots(box) {

    hotspotLayer.innerHTML = "";

    hotspotObjects = [];

    components.forEach(component => {

        const marker = document.createElement("button");

        marker.className = "hotspot";

        marker.innerHTML = `
            <span class="hotspot-dot"></span>
            <span class="hotspot-label">${component.name}</span>
        `;

        marker.title = component.name;

        marker.addEventListener("click", function(e) {

            e.stopPropagation();

            openPopup(component);

        });

        hotspotLayer.appendChild(marker);

        // Convert normalized coordinates to world coordinates
        const position = new THREE.Vector3(
            box.min.x + (box.max.x - box.min.x) * component.x,
            box.min.y + (box.max.y - box.min.y) * component.y,
            box.min.z + (box.max.z - box.min.z) * component.z
        );

        hotspotObjects.push({
            element: marker,
            position: position
        });

    });

}


/* Update Marker Positions Every Frame */

function updateHotspots() {

    if(!wellhead) return;

    const width = window.innerWidth;
    const height = window.innerHeight;

    hotspotObjects.forEach(hotspot => {

        const projected = hotspot.position.clone();

        projected.project(camera);

        const x = (projected.x * 0.5 + 0.5) * width;

        const y = (-projected.y * 0.5 + 0.5) * height;

        const visible =
            projected.z > -1 &&
            projected.z < 1 &&
            x > 0 &&
            x < width &&
            y > 0 &&
            y < height;

        hotspot.element.style.display =
            visible ? "flex" : "none";

        if(visible) {

            hotspot.element.style.left = x + "px";

            hotspot.element.style.top = y + "px";

        }

    });

}


/* Open Popup */

function openPopup(component) {

    document.getElementById("popup-title").innerText =
        component.name;

    document.getElementById("popup-function").innerText =
        component.function;

    document.getElementById("popup-working").innerText =
        component.working;

    document.getElementById("popup-importance").innerText =
        component.importance;

    document.getElementById("info-popup").style.display =
        "block";

}


/* Close Popup */

function closePopup() {

    document.getElementById("info-popup").style.display =
        "none";

}


/* Reset Camera */

function resetCamera() {

    if(!wellhead) return;

    const box = new THREE.Box3().setFromObject(wellhead);

    const center = box.getCenter(new THREE.Vector3());

    controls.target.copy(center);

    camera.position.set(
        center.x + 12,
        center.y + 8,
        center.z + 15
    );

    controls.update();

}


/* Animation */

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    updateHotspots();

    renderer.render(scene, camera);

}


/* Responsive */

window.addEventListener("resize", function() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


/* Close popup with Escape */

window.addEventListener("keydown", function(event) {

    if(event.key === "Escape") {
        closePopup();
    }

});


window.onload = init;

</script>

</body>
</html>
