<script type="module">
import * as THREE from "three";

/* =====================================================
   01. CONFIGURATION
===================================================== */

const W=32;
const D=28;
const H=7.5;

const HALF_W=W/2;
const HALF_D=D/2;

let scene,camera,renderer,clock;
let player;

let yaw=-Math.PI/2;
let pitch=0;

let mouseDown=false;
let lastX=0;
let lastY=0;

let activePanel=false;
let exiting=false;
let target=null;

const keys={};
const mobile={};

const interactables=[];

let seatedAt=null;
let sitting=false;

let savedPlayerPosition=new THREE.Vector3();
let savedYaw=0;

const isMobile=
  matchMedia("(pointer:coarse)").matches ||
  matchMedia("(max-width:900px)").matches ||
  navigator.maxTouchPoints>0;

const hint=document.getElementById("hint");
const panel=document.getElementById("panel");
const panelTitle=document.getElementById("panelTitle");
const panelBody=document.getElementById("panelBody");

const courseViewer=document.getElementById("courseViewer");
const courseFrame=document.getElementById("courseFrame");
const courseViewerTitle=document.getElementById("courseViewerTitle");
const courseLoading=document.getElementById("courseLoading");

/* =====================================================
   02. REAL OFU COURSE DIRECTORY

   Edit these paths to match your actual folders.

   coursesroom.html is inside:
   Virtual University/

   Courses folder is one level above:
   ../Courses/
===================================================== */

const OFU_COURSE_PAGES=[

  {
    title:"COMPRESSOR",
    subtitle:"COMPRESSOR TRAINING",
    url:"../Air_Compressor/Air_Compressor.html"
  },

  {
    title:"BASIC OILFIELD CALCULATIONS",
    subtitle:"OILFIELD CALCULATIONS",
    url:"../Courses/Basic_OilField_Calculations/Basic_OilField_Calculations.html"
  },

  {
    title:"WELL TESTING CRASH COURSE",
    subtitle:"WELL TESTING TRAINING",
    url:"../Courses/Well_Testing_crash_course/Well_Testing_crash_course.html"
  },

  {
    title:"FIELD SPECIALIST LEVEL 1",
    subtitle:"FIELD SPECIALIST TRAINING",
    url:"../Courses/Field_Specialist_L1/Field_Specialist_L1.html"
  },

  {
    title:"K FACTOR",
    subtitle:"K FACTOR TRAINING",
    url:"../Courses/K_Factor/K_Factor.html"
  }

];

/* =====================================================
   03. MATERIALS
===================================================== */

const material=(color,roughness=.7,metalness=0)=>
  new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });

const M={

  floor:material(0x54595c,.85),
  wall:material(0xd4d8d8,.9),
  wall2:material(0x7f8b91,.85),
  ceiling:material(0xb5bdc0,.9),

  wood:material(0x684b35,.65),
  woodTop:material(0x98704c,.55),

  black:material(0x151b20,.5,.25),
  metal:material(0x8d999e,.35,.75),
  metalDark:material(0x344047,.45,.65),

  blue:material(0x075b82,.4,.45),
  blueLight:material(0x1599c5,.35,.4),

  chair:material(0x202d35,.75),
  white:material(0xe9eeee,.7),

  glass:new THREE.MeshPhysicalMaterial({
    color:0xbce6ed,
    transparent:true,
    opacity:.22,
    roughness:.08,
    transmission:.5
  }),

  green:material(0x317c55,.7),
  red:material(0xb52b28,.6),
  yellow:material(0xd3ad43,.65)

};

/* =====================================================
   04. HELPERS
===================================================== */

function box(parent,w,h,d,mat,x,y,z){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

function cylinder(parent,r1,r2,h,mat,x,y,z,segments=24){

  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(r1,r2,h,segments),
    mat
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

function sphere(parent,r,mat,x,y,z){

  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(r,20,16),
    mat
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;

  parent.add(mesh);

  return mesh;
}

function makeTextTexture(title,subtitle){

  const c=document.createElement("canvas");
  c.width=1024;
  c.height=256;

  const ctx=c.getContext("2d");

  ctx.fillStyle="#101d25";
  ctx.fillRect(0,0,1024,256);

  ctx.strokeStyle="#5ce4ff";
  ctx.lineWidth=8;
  ctx.strokeRect(8,8,1008,240);

  ctx.fillStyle="#5ce4ff";
  ctx.font="bold 64px Arial";
  ctx.fillText(title,35,105);

  ctx.fillStyle="#e2edf0";
  ctx.font="30px Arial";
  ctx.fillText(subtitle,38,170);

  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;

  return tex;
}

function sign(parent,title,subtitle,x,y,z,w=5){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,1.1,.12),
    new THREE.MeshStandardMaterial({
      map:makeTextTexture(title,subtitle),
      roughness:.6
    })
  );

  mesh.position.set(x,y,z);
  parent.add(mesh);

  return mesh;
}

/* =====================================================
   05. INITIALIZE
===================================================== */

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0xaab9bd);
  scene.fog=new THREE.Fog(0xaab9bd,30,65);

  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    150
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.12;

  document.body.appendChild(renderer.domElement);

  clock=new THREE.Clock();

  scene.add(
    new THREE.HemisphereLight(0xe9f7ff,0x41464b,2)
  );

  const sun=new THREE.DirectionalLight(0xffffff,2);

  sun.position.set(-8,13,-9);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);

  scene.add(sun);

  buildRoom();
  buildLights();
  buildFrontTeachingWall();
  buildInstructorArea();
  buildStudentRows();
  buildSideFurniture();
  buildPlayer();

  setupControls();
  setupInterface();

  addEventListener("resize",resize);

  animate();

}

/* =====================================================
   06. ROOM ARCHITECTURE
===================================================== */

function buildRoom(){

  box(scene,W,.3,D,M.floor,0,-.17,0);

  const joint=material(0x72797b,.9);

  for(let x=-15;x<=15;x+=2){
    box(scene,.018,.008,D,joint,x,-.01,0);
  }

  for(let z=-13;z<=13;z+=2){
    box(scene,W,.008,.018,joint,0,-.009,z);
  }

  // Rear wall
  box(scene,W,H,.3,M.wall,0,H/2,-14);

  // Front wall
  box(scene,W,H,.3,M.wall,0,H/2,14);

  // Right wall
  box(scene,.3,H,D,M.wall,16,H/2,0);

  // Left wall with doorway
  const opening=6.5;
  const segment=(D-opening)/2;

  box(
    scene,.3,H,segment,M.wall,
    -16,H/2,-(opening/2+segment/2)
  );

  box(
    scene,.3,H,segment,M.wall,
    -16,H/2,(opening/2+segment/2)
  );

  box(
    scene,.3,1.6,opening,M.wall,
    -16,6.7,0
  );

  // Door frame
  box(scene,.22,4.3,.25,M.blue,-15.78,2.15,-3.25);
  box(scene,.22,4.3,.25,M.blue,-15.78,2.15,3.25);
  box(scene,.25,.25,6.7,M.blue,-15.78,4.3,0);

  sign(
    scene,
    "MAIN HALL",
    "ENTRANCE / EXIT",
    -15.55,5.15,0,4.5
  );

  // Ceiling
  box(scene,W,.25,D,M.ceiling,0,7.5,0);

  // Baseboards
  box(scene,W,.18,.15,M.wall2,0,.08,-13.82);
  box(scene,W,.18,.15,M.wall2,0,.08,13.82);

  box(scene,.15,.18,D,M.wall2,15.82,.08,0);
  box(scene,.15,.18,D,M.wall2,-15.82,.08,0);

  // Wall details
  for(let x=-13;x<=13;x+=2.2){
    box(scene,.07,3,.08,M.wall2,x,3.2,-13.78);
  }

  // Carpet
  box(
    scene,21,.025,8,
    material(0x34454d,.95),
    0,.005,7
  );

}

/* =====================================================
   07. LIGHTING
===================================================== */

function buildLights(){

  for(let z=-9;z<=9;z+=6){

    for(let x=-10;x<=10;x+=7){

      box(scene,2.8,.1,.55,M.metalDark,x,7.3,z);
      box(scene,2.5,.04,.38,M.white,x,7.22,z);

      const light=new THREE.PointLight(
        0xf1f8ff,
        1.0,
        11
      );

      light.position.set(x,6.7,z);
      scene.add(light);

    }

  }

  // Projector
  box(scene,.8,.15,.7,M.metalDark,0,6.7,4.4);
  box(scene,.48,.24,.42,M.white,0,6.5,4.4);

}

/* =====================================================
   08. TEACHING SCREEN
===================================================== */

const slides=[

  {
    title:"WELL TESTING FUNDAMENTALS",
    subtitle:"OILFIELD UNIVERSITY",
    points:[
      "Surface Well Testing Overview",
      "Pressure and Temperature Monitoring",
      "Flow Measurement",
      "Sampling and Fluid Analysis",
      "Data Acquisition"
    ]
  },

  {
    title:"SURFACE WELL TESTING",
    subtitle:"TRAINING MODULE",
    points:[
      "Understand the test objectives",
      "Identify measurement channels",
      "Monitor operating conditions",
      "Record and validate field data",
      "Prepare accurate test reports"
    ]
  },

  {
    title:"DATA ACQUISITION",
    subtitle:"DAQ TRAINING",
    points:[
      "Sensor and transmitter signals",
      "Pressure and temperature channels",
      "Live trends and data recording",
      "Data quality and validation",
      "Operational reporting"
    ]
  },

  {
    title:"SAMPLING & FLUID ANALYSIS",
    subtitle:"LABORATORY TRAINING",
    points:[
      "BS&W",
      "API Gravity",
      "Gas Specific Gravity",
      "Water Specific Gravity",
      "Shrinkage and gas detection"
    ]
  }

];

let boardCanvas;
let boardTexture;
let boardContext;
let slideIndex=0;

function buildFrontTeachingWall(){

  box(
    scene,12,5.5,.32,
    M.black,
    0,4.1,-13.55
  );

  boardCanvas=document.createElement("canvas");
  boardCanvas.width=1600;
  boardCanvas.height=900;

  boardContext=boardCanvas.getContext("2d");

  boardTexture=new THREE.CanvasTexture(boardCanvas);
  boardTexture.colorSpace=THREE.SRGBColorSpace;

  const display=new THREE.Mesh(
    new THREE.PlaneGeometry(11.6,5.15),
    new THREE.MeshBasicMaterial({map:boardTexture})
  );

  display.position.set(0,4.1,-13.36);
  scene.add(display);

  // Whiteboard
  box(scene,2.8,2,.18,M.metalDark,-8,3.7,-13.55);
  box(scene,2.55,1.75,.035,M.white,-8,3.7,-13.43);

  for(let i=0;i<4;i++){
    box(
      scene,1.8,.025,.012,
      material(0x247da0),
      -8,4.25-i*.35,-13.39
    );
  }

  box(scene,2.5,.08,.2,M.metal,-8,2.65,-13.35);

  interactables.push({

    title:"INTERACTIVE TEACHING SCREEN",

    position:new THREE.Vector3(0,4,-11.8),

    description:
      "The classroom teaching screen is used to present training lessons and course material.",

    details:[
      "Well Testing Fundamentals",
      "Surface Well Testing",
      "Data Acquisition",
      "Sampling and Fluid Analysis"
    ],

    action:"slides"

  });

  drawSlide();

}

function drawSlide(){

  const ctx=boardContext;
  const s=slides[slideIndex];

  ctx.fillStyle="#071a27";
  ctx.fillRect(0,0,1600,900);

  ctx.fillStyle="#0d354b";
  ctx.fillRect(0,0,1600,150);

  ctx.fillStyle="#5ce3ff";
  ctx.font="bold 56px Arial";
  ctx.fillText("OILFIELD UNIVERSITY",65,75);

  ctx.fillStyle="#b7dbe7";
  ctx.font="26px Arial";
  ctx.fillText("PROFESSIONAL OILFIELD TRAINING",68,118);

  ctx.fillStyle="#ffffff";
  ctx.font="bold 60px Arial";
  ctx.fillText(s.title,70,260);

  ctx.fillStyle="#5ce3ff";
  ctx.font="30px Arial";
  ctx.fillText(s.subtitle,75,315);

  ctx.fillStyle="#2e829d";
  ctx.fillRect(75,350,1450,5);

  s.points.forEach((point,i)=>{

    const y=440+i*83;

    ctx.fillStyle="#42c8ed";
    ctx.beginPath();
    ctx.arc(105,y-10,10,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#e2edf4";
    ctx.font="36px Arial";
    ctx.fillText(point,145,y);

  });

  ctx.fillStyle="#0d354b";
  ctx.fillRect(0,825,1600,75);

  ctx.fillStyle="#a8d3e2";
  ctx.font="24px Arial";

/* =====================================================
   16. CONTROLS
===================================================== */

function setupControls(){

  addEventListener("keydown",e=>{

    const key=e.key.toLowerCase();

    keys[key]=true;

    if(key==="e"){

      if(sitting){
        leaveWorkstation();
      }else{
        interact();
      }

    }

    if(e.key==="Escape"){

      if(sitting){
        leaveWorkstation();
      }else{
        closePanel();
      }

    }

    if([
      "ArrowUp",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight"
    ].includes(e.key)){
      e.preventDefault();
    }

  });

  addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
  });

  // Desktop mouse look
  renderer.domElement.addEventListener("mousedown",e=>{

    if(activePanel || sitting)return;

    mouseDown=true;
    lastX=e.clientX;
    lastY=e.clientY;

  });

  addEventListener("mouseup",()=>{
    mouseDown=false;
  });

  addEventListener("mousemove",e=>{

    if(!mouseDown || activePanel || sitting)return;

    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;

    yaw-=dx*.004;

    pitch=Math.max(
      -.4,
      Math.min(.35,pitch-dy*.003)
    );

    lastX=e.clientX;
    lastY=e.clientY;

  });

  // Mobile camera swipe on right side
  renderer.domElement.addEventListener("touchstart",e=>{

    if(activePanel || sitting)return;

    const t=e.changedTouches[0];

    if(t.clientX>innerWidth*.4){

      mouseDown=true;
      lastX=t.clientX;
      lastY=t.clientY;

    }

  },{passive:true});

  renderer.domElement.addEventListener("touchmove",e=>{

    if(!mouseDown || activePanel || sitting)return;

    for(const t of e.changedTouches){

      if(t.clientX<innerWidth*.4)continue;

      const dx=t.clientX-lastX;
      const dy=t.clientY-lastY;

      yaw-=dx*.006;

      pitch=Math.max(
        -.4,
        Math.min(.35,pitch-dy*.004)
      );

      lastX=t.clientX;
      lastY=t.clientY;

      break;

    }

  },{passive:true});

  renderer.domElement.addEventListener("touchend",()=>{
    mouseDown=false;
  });

  renderer.domElement.addEventListener("touchcancel",()=>{
    mouseDown=false;
  });

  // Mobile D-pad
  const bindings={
    up:"w",
    down:"s",
    left:"a",
    right:"d"
  };

  Object.entries(bindings).forEach(([id,key])=>{

    const b=document.getElementById(id);

    b.addEventListener("pointerdown",e=>{

      e.preventDefault();

      mobile[key]=true;

      b.setPointerCapture?.(e.pointerId);

    });

    b.addEventListener("pointerup",e=>{

      e.preventDefault();

      mobile[key]=false;

    });

    b.addEventListener("pointercancel",()=>{
      mobile[key]=false;
    });

    b.addEventListener("lostpointercapture",()=>{
      mobile[key]=false;
    });

  });

}

/* =====================================================
   17. PLAYER MOVEMENT
===================================================== */

function updateMovement(dt){

  if(activePanel || exiting || sitting)return;

  const f=(keys.w||keys.arrowup||mobile.w)?1:0;
  const b=(keys.s||keys.arrowdown||mobile.s)?1:0;
  const l=(keys.a||keys.arrowleft||mobile.a)?1:0;
  const r=(keys.d||keys.arrowright||mobile.d)?1:0;

  let mx=r-l;
  let mz=b-f;

  if(mx===0 && mz===0)return;

  const length=Math.hypot(mx,mz);

  mx/=length;
  mz/=length;

  const speed=(keys.shift?7.5:4.8)*dt;

  const fx=-Math.sin(yaw);
  const fz=-Math.cos(yaw);

  const rx=Math.cos(yaw);
  const rz=-Math.sin(yaw);

  const dx=(fx*mz+rx*mx)*speed;
  const dz=(fz*mz+rz*mx)*speed;

  let nx=player.position.x+dx;
  let nz=player.position.z+dz;

  if(nx>-14.7 && nx<14.7){
    player.position.x=nx;
  }

  if(nz>-12.7 && nz<12.7){
    player.position.z=nz;
  }

  if(
    player.position.x<-14.4 &&
    Math.abs(player.position.z)>2.8
  ){
    player.position.x=-14.4;
  }

  if(dx!==0 || dz!==0){
    player.rotation.y=Math.atan2(-dx,-dz);
  }

}

/* =====================================================
   18. CAMERA
===================================================== */

function updateCamera(){

  if(sitting && seatedAt){

    // Camera is fixed while the real course viewer is open.
    camera.position.set(
      seatedAt.seatPosition.x,
      2.05,
      seatedAt.seatPosition.z+.35
    );

    camera.lookAt(
      seatedAt.seatPosition.x,
      1.72,
      seatedAt.seatPosition.z-1.365
    );

    return;

  }

  const distance=5.2;

  const targetPosition=new THREE.Vector3(
    player.position.x+Math.sin(yaw)*distance,
    player.position.y+2.8,
    player.position.z+Math.cos(yaw)*distance
  );

  camera.position.lerp(targetPosition,.12);

  camera.lookAt(
    player.position.x,
    player.position.y+1.55+pitch*4,
    player.position.z
  );

}

   19. OPEN REAL COURSE PAGE

  if(!item || !item.courseURL)return;

  courseViewerTitle.textContent=
    "OFU COURSE · "+item.course.title;

  courseViewer.style.display="flex";

}

/* =====================================================
   20. SIT AT WORKSTATION
===================================================== */

function sitAtWorkstation(item){

  if(sitting || !item.seatPosition)return;

  seatedAt=item;

  savedPlayerPosition.copy(player.position);
  savedYaw=yaw;

  player.position.copy(item.seatPosition);

  yaw=0;
  player.rotation.y=0;

  setPlayerSitting(true);

  sitting=true;
  activePanel=false;

  panel.style.display="none";

  // Hide the character to prevent obstruction.
  player.visible=false;

  // Open the actual course page.
  openRealCourse(item);

  document.getElementById("exitSeat").style.display="block";

  if(isMobile){

    document.getElementById("mobilePad").style.display="none";
    document.getElementById("interact").style.display="none";

  }

  hint.textContent="STUDYING: "+item.course.title;

  document.getElementById("status").textContent=
    "STATION "+
    String(item.stationIndex).padStart(2,"0")+
    " · "+
    item.course.title;

  camera.position.set(
    item.seatPosition.x,
    2.05,
    item.seatPosition.z+.35
  );

  camera.lookAt(
    item.seatPosition.x,
    1.72,
    item.seatPosition.z-1.365
  );

}

/* =====================================================
   21. EXIT WORKSTATION
===================================================== */

function leaveWorkstation(){

  if(!sitting)return;

  sitting=false;

  // Close and unload the course page.
  courseViewer.style.display="none";
  courseFrame.src="about:blank";

  courseLoading.style.display="block";

  player.position.copy(savedPlayerPosition);
  yaw=savedYaw;

  setPlayerSitting(false);

  player.rotation.y=yaw;
  player.visible=true;

  seatedAt=null;

  document.getElementById("exitSeat").style.display="none";

  if(isMobile){

    document.getElementById("mobilePad").style.display="block";

    const interactButton=document.getElementById("interact");

    interactButton.style.display="block";
    interactButton.textContent="INTERACT";
    interactButton.style.background="#087da8";

  }

  document.getElementById("status").textContent="CLASSROOM READY";

  hint.textContent="Explore the classroom";

}

/* =====================================================
   22. INTERACTION TARGET
===================================================== */

function updateTarget(){

  if(sitting){

    hint.textContent="STUDYING: "+seatedAt.course.title;
    return;

  }

  target=null;

  let closest=Infinity;

  for(const item of interactables){

    const d=player.position.distanceTo(item.position);

    if(d<3.4 && d<closest){

      closest=d;
      target=item;

    }

  }

  if(target){

    if(target.action==="workstation"){

      hint.textContent=
        "E / INTERACT · OPEN "+target.course.title;

    }else{

      hint.textContent="E / INTERACT · "+target.title;

    }

  }else if(isNearDoor()){

    hint.textContent="E / INTERACT · RETURN TO MAIN HALL";

  }else if(!activePanel){

    hint.textContent="Explore the classroom";

  }

}

/* =====================================================
   23. INTERACT
===================================================== */

function interact(){

  if(sitting){
    leaveWorkstation();
    return;
  }

  if(activePanel){
    closePanel();
    return;
  }

  if(target){

    if(target.action==="workstation"){

      sitAtWorkstation(target);

    }else{

      openPanel(target);

    }

  }else if(isNearDoor()){

    returnToMainHall();

  }

}

/* =====================================================
   24. INFORMATION PANEL
===================================================== */

function openPanel(item){

  activePanel=true;

  panelTitle.textContent=item.title;

  let html=`<p>${item.description}</p>`;

  if(item.details){

    html+="<h3>CLASSROOM INFORMATION</h3><ul>";

    item.details.forEach(t=>{
      html+=`<li>${t}</li>`;
    });

  }

  if(item.action==="slides"){

    html+=`

      <h3>TEACHING SCREEN CONTROLS</h3>

      <p>Current slide: ${slideIndex+1} of ${slides.length}</p>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px">

        <button id="previousSlide"
          style="padding:12px;background:#087da8;color:white;border:0;border-radius:7px">
          ← PREVIOUS
        </button>

        <button id="nextSlide"
          style="padding:12px;background:#087da8;color:white;border:0;border-radius:7px">
          NEXT →
        </button>

      </div>

    `;

  }

  panelBody.innerHTML=html;
  panel.style.display="block";

  const next=document.getElementById("nextSlide");
  const previous=document.getElementById("previousSlide");

  if(next){

    next.onclick=()=>{

      slideIndex=(slideIndex+1)%slides.length;

      drawSlide();
      openPanel(item);

    };

  }

  if(previous){

    previous.onclick=()=>{

      slideIndex=
        (slideIndex-1+slides.length)%slides.length;

      drawSlide();
      openPanel(item);

    };

  }

  hint.textContent="Close the panel to continue";

}

function closePanel(){

  activePanel=false;
  panel.style.display="none";

}

/* =====================================================
   25. MAIN HALL CONNECTION
===================================================== */

function isNearDoor(){

  return (
    player.position.x<-14.2 &&
    Math.abs(player.position.z)<2.8
  );

}

function returnToMainHall(){

  if(exiting)return;

  exiting=true;

  hint.textContent="Returning to Main Hall...";

  setTimeout(()=>{

    sessionStorage.setItem("mainHallEntry","coursesroom");
    sessionStorage.setItem("coursesRoomEntry","mainhall");

    location.href="mainhall.html?entry=coursesroom";

  },500);

}

/* =====================================================
   26. ANIMATION
===================================================== */

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.04);

  updateMovement(dt);
  updateCamera();
  updateTarget();

  renderer.render(scene,camera);

}

/* =====================================================
   27. RESIZE
===================================================== */

function resize(){

  camera.aspect=innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);

  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));

}

/* =====================================================
   28. START
===================================================== */

init();

</script>
</body>
</html>
