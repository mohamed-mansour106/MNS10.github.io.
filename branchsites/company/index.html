<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="شركة منصور">
<title>شركة منصور الافتراضية</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#16233f; --card:#16233f; --line:#26334f;
    --txt:#e8eefc; --dim:#93a4c4; --green:#34d399; --gray:#8a97ad;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  body{
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #16294d 0%, var(--bg) 60%);
    color:var(--txt); min-height:100vh; padding-bottom:40px;
  }
  header{max-width:920px; margin:0 auto; padding:22px 16px 6px; text-align:center}
  header h1{font-size:24px; letter-spacing:.5px}
  header .mgr{color:var(--dim); font-size:13px; margin-top:6px}
  .summary{display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap}
  .chip{background:var(--card); border:1px solid var(--line); border-radius:999px;
        padding:6px 14px; font-size:13px; display:flex; align-items:center; gap:7px}
  .dot{width:9px;height:9px;border-radius:50%; display:inline-block}
  .dot.green{background:var(--green); box-shadow:0 0 8px var(--green)}
  .dot.gray{background:var(--gray)}
  .updated{color:var(--dim); font-size:12px; margin-top:10px}
  .tabs{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; max-width:920px; margin:16px auto 0; padding:0 12px}
  .dtab{background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:999px;
        padding:8px 16px; font-size:13.5px; cursor:pointer; font-family:inherit; transition:.15s}
  .dtab.on{border-color:var(--green); color:var(--green); font-weight:600}
  .dtab.soon{opacity:.6}
  .floor-wrap{max-width:860px; margin:6px auto 0; padding:0 6px}
  svg{width:100%; height:auto; display:block}
  .soonbox{display:none; max-width:560px; margin:30px auto 10px; background:var(--card); border:1px dashed #3b4f7a;
           border-radius:16px; padding:34px 22px; text-align:center}
  .soonbox .big{font-size:20px; font-weight:700; margin-bottom:10px}
  .soonbox .note{color:var(--dim); font-size:14px; line-height:1.9}
  .soonbox .tag{display:inline-block; margin-top:14px; font-size:12px; color:#facc15; border:1px solid #facc15;
                border-radius:999px; padding:5px 14px}
  .hint{text-align:center; color:var(--dim); font-size:12.5px; margin-top:2px}
  .cards{max-width:920px; margin:14px auto 0; padding:0 14px;
         display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
        padding:14px; cursor:pointer; transition:transform .15s, border-color .15s}
  .card:hover{transform:translateY(-2px); border-color:#3b4f7a}
  .card .top{display:flex; align-items:center; gap:10px}
  .avatar{width:38px;height:38px;border-radius:10px; display:flex;align-items:center;justify-content:center;
          font-weight:bold; font-size:17px; color:#0b1220}
  .card .name{font-size:16px; font-weight:600}
  .card .role{font-size:12px; color:var(--dim)}
  .card .statusline{margin-top:10px; font-size:13px; display:flex; align-items:center; gap:7px}
  .card .task{margin-top:6px; font-size:12.5px; color:var(--dim); line-height:1.6}
  footer{max-width:920px; margin:26px auto 0; padding:0 16px; text-align:center;
         color:var(--dim); font-size:12.5px; line-height:1.9}
  /* pop-up */
  .overlay{position:fixed; inset:0; background:rgba(4,8,18,.7); opacity:0; pointer-events:none; transition:.2s; z-index:40}
  .overlay.open{opacity:1; pointer-events:auto}
  .panel{position:fixed; left:50%; top:50%; z-index:50; background:var(--bg2);
         border:1px solid var(--line); border-radius:18px;
         width:min(470px, calc(100vw - 26px)); max-height:84vh; overflow-y:auto;
         padding:18px 18px 24px; opacity:0; pointer-events:none;
         transform:translate(-50%,-48%) scale(.94); transition:opacity .2s, transform .22s ease}
  .panel.open{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1)}
  .panel .head{display:flex; align-items:center; gap:12px}
  .panel .avatar{width:46px;height:46px;font-size:20px;border-radius:12px}
  .panel h2{font-size:19px}
  .panel .role{color:var(--dim); font-size:13px}
  .badge{margin-inline-start:auto; font-size:12px; padding:5px 12px; border-radius:999px; border:1px solid var(--line); white-space:nowrap}
  .badge.working{color:var(--green); border-color:var(--green)}
  .badge.idle{color:var(--gray)}
  .sect{margin-top:16px}
  .sect h3{font-size:13.5px; color:var(--dim); font-weight:600; margin-bottom:8px; letter-spacing:.3px}
  .nowtask{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-size:14px; line-height:1.7}
  .taskrow{display:flex; align-items:center; gap:9px; padding:7px 2px; font-size:14px; border-bottom:1px dashed #1d2c4a}
  .taskrow:last-child{border-bottom:none}
  .tick{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line); flex:none;
        display:flex; align-items:center; justify-content:center; font-size:11px; color:#0b1220}
  .taskrow.done .tick{background:var(--green); border-color:var(--green)}
  .taskrow.done span{text-decoration:line-through; color:var(--dim)}
  .rule{padding:6px 2px; font-size:13.5px; color:var(--dim); display:flex; gap:8px; line-height:1.7}
  .rule::before{content:"•"; color:#f87171}
  .lastdone{margin-top:14px; background:#102a22; border:1px solid #1c4a3a; color:#a7e9cd;
            border-radius:12px; padding:10px 13px; font-size:13px; line-height:1.7}
  .closebtn{margin-top:18px; width:100%; background:var(--card); color:var(--txt); border:1px solid var(--line);
            border-radius:12px; padding:12px; font-size:15px; cursor:pointer; font-family:inherit}
  /* ---- animation ---- */
  @keyframes pulse{0%{opacity:.7; transform:scale(1)}100%{opacity:0; transform:scale(2.6)}}
  @keyframes typeArm{from{transform:translateY(0)}to{transform:translateY(-2.6px)}}
  @keyframes headBob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
  @keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:.95}}
  @keyframes steamUp{0%{transform:translateY(0);opacity:.55}100%{transform:translateY(-9px);opacity:0}}
  @keyframes phoneGlow{0%,100%{opacity:.45}50%{opacity:1}}
  .pulse{transform-origin:center; transform-box:fill-box; animation:pulse 1.6s ease-out infinite}
  .armL{transform-box:fill-box; animation:typeArm .3s ease-in-out infinite alternate}
  .armR{transform-box:fill-box; animation:typeArm .37s ease-in-out .12s infinite alternate}
  .headBob{transform-box:fill-box; transform-origin:50% 90%; animation:headBob 3.4s ease-in-out infinite}
  .breathe{transform-box:fill-box; transform-origin:50% 100%; animation:breathe 3.6s ease-in-out infinite}
  .sway{transform-box:fill-box; transform-origin:50% 100%; animation:sway 5.2s ease-in-out infinite}
  .l1{animation:blink 1.1s linear infinite}
  .l2{animation:blink 1.7s linear .3s infinite}
  .l3{animation:blink 2.3s linear .6s infinite}
  .steam{transform-box:fill-box; animation:steamUp 2.4s ease-out infinite}
  .steam2{transform-box:fill-box; animation:steamUp 2.4s ease-out 1.2s infinite}
  .phoneGlow{animation:phoneGlow 2.1s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
  .roomhit{cursor:pointer}
.goalrow{padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.08)}.gtext{font-size:14px;margin-bottom:6px}.gbar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.gbar i{display:block;height:100%;border-radius:6px}.glab{font-size:12px;color:#9fb0c8;margin-top:5px}
.floorpages{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.pgbtn{background:#1b2a44;color:#cfe0f5;border:1px solid #2c4166;border-radius:14px;padding:8px 14px;font:inherit;font-size:14px}.pgbtn.on{background:#38bdf8;color:#04121f;border-color:#38bdf8}
</style>
</head>

function departments(){ 
  if(DATA.departments) return DATA.departments;
  if(DATA.employees) return [{id:"all", name:"الشركة", status:"active", employees:DATA.employees}];
  return [];
}
function activeDept(){
  const ds = departments();
  let d = ds.find(x=>x.id===ACTIVE_DEPT);
  if(!d) d = ds.find(x=>x.status!=="soon") || ds[0];
  return d;
}
function findEmployee(id){
  const ds = departments();
  for(const d of ds){ if(!d.employees) continue;
    const e = d.employees.find(x=>x.id===id); if(e) return {dept:d, emp:e}; }
  return null;
}

/* ---------- isometric helpers ---------- */
const EX={x:86.6,y:50}, EY={x:-86.6,y:50}, UH=100;
function P(u,v,h){ h=h||0; return [EX.x*u+EY.x*v, EX.y*u+EY.y*v-UH*h]; }
function pts(a){ return a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "); }
function poly(a,fill,extra){ return '<polygon points="'+pts(a)+'" fill="'+fill+'" '+(extra||"")+'/>'; }
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.min(255,Math.round(r*f)); g=Math.min(255,Math.round(g*f)); b=Math.min(255,Math.round(b*f));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function box(u0,v0,u1,v1,h0,h1,c){
  return poly([P(u0,v0,h1),P(u1,v0,h1),P(u1,v1,h1),P(u0,v1,h1)], shade(c,1.12))
       + poly([P(u0,v1,h1),P(u1,v1,h1),P(u1,v1,h0),P(u0,v1,h0)], shade(c,0.82))
       + poly([P(u1,v0,h1),P(u1,v1,h1),P(u1,v1,h0),P(u1,v0,h0)], shade(c,0.62));
}
function textAt(x,y,str,size,fill,extra){ return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" fill="'+fill+
  '" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial" '+(extra||"")+'>'+str+'</text>'; }

const SKIN = "#f2c9a0", SKIN_D = "#e0b48a";
function lookOf(emp, idx){
  const l = (emp.look && emp.look.hair) ? emp.look : (LOOKS[emp.id] || {hair:LOOK_BY_INDEX[idx % 4], hairColor:"#241a12"});
  return {hair:l.hair, hairColor:l.hairColor || "#241a12"};
}
function hairBack(style, hc, hx, hy){
  let s = "";
  if(style==="long") s += '<ellipse cx="'+hx+'" cy="'+(hy+13)+'" rx="12.5" ry="15" fill="'+hc+'"/>';
  s += '<circle cx="'+hx+'" cy="'+hy+'" r="14.5" fill="'+hc+'"/>';
  if(style==="curly")
    s += '<circle cx="'+(hx-9)+'" cy="'+(hy-10)+'" r="4.5" fill="'+hc+'"/>'
       + '<circle cx="'+hx+'" cy="'+(hy-13)+'" r="4.5" fill="'+hc+'"/>'
       + '<circle cx="'+(hx+9)+'" cy="'+(hy-10)+'" r="4.5" fill="'+hc+'"/>';
  if(style==="bun")
    s += '<circle cx="'+hx+'" cy="'+(hy-13)+'" r="5" fill="'+hc+'"/>';
  s += '<circle cx="'+hx+'" cy="'+(hy+7)+'" r="9" fill="'+SKIN+'"/>';
  return s;
}
function headFront(style, hc, fx, fy){
  let s = "";
  if(style==="long"){
    s += '<path d="M '+(fx-12)+' '+(fy-8)+' q -6 16 -3 30 l 7 0 q -2 -16 0 -26 z" fill="'+hc+'"/>';
    s += '<path d="M '+(fx+12)+' '+(fy-8)+' q 6 16 3 30 l -7 0 q 2 -16 0 -26 z" fill="'+hc+'"/>';
  }
  s += '<circle cx="'+fx+'" cy="'+(fy-2)+'" r="14" fill="'+hc+'"/>';
  if(style==="curly")
    s += '<circle cx="'+(fx-9)+'" cy="'+(fy-13)+'" r="4.5" fill="'+hc+'"/>'
       + '<circle cx="'+fx+'" cy="'+(fy-16)+'" r="4.5" fill="'+hc+'"/>'
       + '<circle cx="'+(fx+9)+'" cy="'+(fy-13)+'" r="4.5" fill="'+hc+'"/>';
  if(style==="bun")
    s += '<circle cx="'+fx+'" cy="'+(fy-16)+'" r="4.8" fill="'+hc+'"/>';
  s += '<circle cx="'+fx+'" cy="'+(fy+1)+'" r="12.3" fill="'+SKIN+'"/>';
  s += '<circle cx="'+(fx-4.5)+'" cy="'+(fy)+'" r="1.7" fill="#26334f"/>';
  s += '<circle cx="'+(fx+4.5)+'" cy="'+(fy)+'" r="1.7" fill="#26334f"/>';
  s += '<rect x="'+(fx-7)+'" y="'+(fy-5.4)+'" width="5" height="1.4" rx="0.7" fill="'+hc+'"/>';
  s += '<rect x="'+(fx+2)+'" y="'+(fy-5.4)+'" width="5" height="1.4" rx="0.7" fill="'+hc+'"/>';
  s += '<path d="M '+(fx-4)+' '+(fy+6)+' q 4 4.5 8 0" stroke="#b96b4a" stroke-width="1.5" fill="none" stroke-linecap="round"/>';
  return s;
}
function personWorking(emp, du, dv, look){
  const shirt = shade(emp.accent, 0.85), shirtD = shade(emp.accent, 0.62);
  const hp = P(du+0.48, dv+0.71, 0.70);
  let s = "";
  s += box(du+0.35, dv+0.70, du+0.61, dv+0.98, 0.10, 0.24, "#31435f");
  s += box(du+0.35, dv+0.88, du+0.61, dv+0.98, 0.24, 0.60, "#31435f");
  s += box(du+0.36, dv+0.60, du+0.60, dv+0.82, 0.24, 0.54, shirt);
  s += box(du+0.34, dv+0.58, du+0.62, dv+0.72, 0.50, 0.58, shirtD);
  s += '<g class="headBob">'
     + box(du+0.45, dv+0.68, du+0.51, dv+0.74, 0.54, 0.62, SKIN_D)
     + hairBack(look.hair, look.hairColor, hp[0], hp[1])
     + '</g>';

}
function personIdle(emp, du, dv, look){
  const shirt = shade(emp.accent, 0.85), shirtD = shade(emp.accent, 0.62);

     + '<path d="M '+(px-14)+' '+(py-38)+' q -6 9 -4 17" stroke="'+shirtD+'" stroke-width="5" fill="none" stroke-linecap="round"/>'
     + '<path d="M '+(px+14)+' '+(py-38)+' q 7 7 3 15" stroke="'+shirtD+'" stroke-width="5" fill="none" stroke-linecap="round"/>'
     + '<circle cx="'+(px+16)+'" cy="'+(py-21)+'" r="3.2" fill="'+SKIN+'"/>'

     + '<circle class="phoneGlow" cx="'+(px+17)+'" cy="'+(py-23)+'" r="1.8" fill="#9fd7f5"/>'

  s += '<g class="headBob">' + headFront(look.hair, look.hairColor, px, py-56) + '</g>';
  s += box(du+0.70, dv+0.20, du+0.77, dv+0.27, 0.42, 0.50, "#e8eefc");
  const st = P(du+0.735, dv+0.235, 0.56);
  s += '<circle class="steam" cx="'+st[0].toFixed(1)+'" cy="'+st[1].toFixed(1)+'" r="1.7" fill="#cfe3ff" opacity="0.5"/>';
  s += '<circle class="steam2" cx="'+(st[0]+3).toFixed(1)+'" cy="'+st[1].toFixed(1)+'" r="1.4" fill="#cfe3ff" opacity="0.5"/>';

/* ---------- one desk cluster ---------- */
function cluster(emp, du, dv, idx){
  const A = emp.accent;
  const look = lookOf(emp, idx);
  const working = emp.status === "working";
  let s = "";
  s += poly([P(du-0.15,dv-0.12,0.01),P(du+1.05,dv-0.12,0.01),P(du+1.05,dv+1.25,0.01),P(du-0.15,dv+1.25,0.01)], A, 'opacity="0.22"');
  s += box(du, dv, du+0.9, dv+0.32, 0, 0.42, "#f2f5fa");
  s += box(du+0.41, dv+0.12, du+0.51, dv+0.22, 0.42, 0.48, "#5b6a80");
  s += box(du+0.21, dv+0.12, du+0.65, dv+0.18, 0.48, 0.86, "#2c3a52");
  if(working){
    s += poly([P(du+0.21,dv+0.18,0.48),P(du+0.65,dv+0.18,0.48),P(du+0.65,dv+0.18,0.86),P(du+0.21,dv+0.18,0.86)], shade(A,1.25));
    const line = (u0,u1,h,cls)=> poly([P(du+u0,dv+0.181,h),P(du+u1,dv+0.181,h),P(du+u1,dv+0.181,h+0.02),P(du+u0,dv+0.181,h+0.02)], "#eaf6ff", 'class="'+cls+'"');
    s += line(0.24,0.44,0.56,"l1") + line(0.24,0.58,0.63,"l2") + line(0.31,0.52,0.70,"l3")
       + line(0.24,0.47,0.77,"l2") + line(0.24,0.61,0.83,"l1");
  } else {
    s += poly([P(du+0.21,dv+0.18,0.48),P(du+0.65,dv+0.18,0.48),P(du+0.65,dv+0.18,0.86),P(du+0.21,dv+0.18,0.86)], "#3a4763");
    const cur = P(du+0.43, dv+0.18, 0.67);
    s += '<circle class="l2" cx="'+cur[0].toFixed(1)+'" cy="'+cur[1].toFixed(1)+'" r="2" fill="#8fa3c8"/>';
  }
  s += box(du+0.19, dv+0.22, du+0.63, dv+0.28, 0.42, 0.445, "#c9d2e0");
  if(working){
    s += '<g class="armL">'+box(du+0.28, dv+0.20, du+0.36, dv+0.27, 0.445, 0.49, SKIN)+'</g>';
    s += '<g class="armR">'+box(du+0.50, dv+0.20, du+0.58, dv+0.27, 0.445, 0.49, SKIN)+'</g>';
  }
  s += working ? personWorking(emp, du, dv, look) : personIdle(emp, du, dv, look);
  s += poly([P(du-0.15,dv-0.12,1.15),P(du+1.05,dv-0.12,1.15),P(du+1.05,dv+1.25,0),P(du-0.15,dv+1.25,0)], "rgba(0,0,0,0)", 'class="roomhit" data-id="'+emp.id+'"');
  s += poly([P(du-0.15,dv-0.12,0),P(du+1.05,dv-0.12,0),P(du+1.05,dv+1.25),P(du-0.15,dv+1.25)], "rgba(0,0,0,0)", 'class="roomhit" data-id="'+emp.id+'"');
  return s;
}

function plateOf(emp, pu, pv){
  const p = P(pu, pv, 0);
  const fx = p[0], topY = p[1] - 12;
  const stColor = emp.status==="working" ? "#34d399" : "#8a97ad";
  let s = '<g class="roomhit" data-id="'+emp.id+'" style="cursor:pointer">';
  s += '<rect x="'+(fx-88)+'" y="'+topY+'" width="176" height="66" rx="11"'
     + ' fill="rgba(9,15,28,0.88)" stroke="'+emp.accent+'" stroke-opacity="0.55"/>';
  s += textAt(fx, topY+23, emp.office, 14, "#e8eefc", 'font-weight="600"');
  s += '<circle cx="'+fx+'" cy="'+(topY+36)+'" r="5" fill="'+stColor+'"/>';
  if(emp.status==="working")
    s += '<circle class="pulse" cx="'+fx+'" cy="'+(topY+36)+'" r="5" fill="none" stroke="'+stColor+'" stroke-width="2" pointer-events="none"/>';
  s += textAt(fx, topY+56, (STATUS_AR[emp.status]||emp.status)+" - "+emp.name, 11, stColor);
  return s + "</g>";
}

/* ---------- layouts: 1 to 5 desks per floor ---------- */
const FLOOR = 4.2;
const LAYOUTS = {
  1: [ {du:1.65, dv:1.50, pu:2.10, pv:3.20} ],
  2: [ {du:0.85, dv:1.50, pu:1.30, pv:3.20}, {du:2.45, dv:1.50, pu:2.90, pv:3.20} ],
  3: [ {du:0.85, dv:0.55, pu:1.30, pv:1.90}, {du:2.45, dv:0.55, pu:2.90, pv:1.90},
       {du:1.65, dv:2.75, pu:2.10, pv:4.15} ],
  4: [ {du:0.35, dv:0.50, pu:1.70, pv:1.15}, {du:2.75, dv:0.50, pu:3.85, pv:1.90},
       {du:0.35, dv:2.55, pu:0.80, pv:4.10}, {du:2.75, dv:2.55, pu:3.20, pv:4.10} ],
  5: [ {du:0.25, dv:0.45, pu:0.70, pv:1.80}, {du:1.65, dv:0.45, pu:2.10, pv:1.80},
       {du:3.05, dv:0.45, pu:3.50, pv:1.80},
       {du:0.95, dv:2.75, pu:1.40, pv:4.15}, {du:2.35, dv:2.75, pu:2.80, pv:4.15} ]
};

function renderFloor(){
  const d = activeDept();
  const svgEl = document.getElementById("floor");
  const soonEl = document.getElementById("soonbox");
  const hintEl = document.getElementById("hint");
  if(!d || d.status==="soon"){
    svgEl.style.display = "none";
    soonEl.style.display = "block";
    hintEl.style.display = "none";
    soonEl.innerHTML = '<div class="big">'+(d ? d.name : "")+'</div>'
      + '<div class="note">'+(d && d.note ? d.note : "القسم ده لسه بيتخطط")+'</div>'
      + '<div class="tag">قريباً</div>';
    return;
  }
  svgEl.style.display = "block";
  soonEl.style.display = "none";
  hintEl.style.display = "block";
  const allEmps = d.employees || [];
  const rooms = Math.ceil(allEmps.length/PER_ROOM);
  if(FLOOR_PAGE>=rooms) FLOOR_PAGE=0;
  const emps = allEmps.slice(FLOOR_PAGE*PER_ROOM, FLOOR_PAGE*PER_ROOM+PER_ROOM);
  let pg=document.getElementById('floorpages');
  if(!pg){ pg=document.createElement('div'); pg.id='floorpages'; pg.className='floorpages'; svgEl.parentNode.insertBefore(pg, svgEl.nextSibling); }
  pg.innerHTML = rooms>1 ? Array.from({length:rooms},(_,k)=>'<button class="pgbtn'+(k===FLOOR_PAGE?' on':'')+'" data-page="'+k+'">غرفة '+(k+1)+'</button>').join('') : '';
  const layout = LAYOUTS[Math.min(emps.length,5)] || LAYOUTS[5];
  const items = [];
  let s = "";
  const gc = P(FLOOR/2, FLOOR/2, 0);
  s += '<ellipse cx="'+gc[0]+'" cy="'+(gc[1]+14)+'" rx="'+(FLOOR*105)+'" ry="'+(FLOOR*52)+'" fill="rgba(2,6,14,0.5)"/>';
  s += poly([P(0,0,0),P(FLOOR,0,0),P(FLOOR,0,1.6),P(0,0,1.6)], "#dfe7f2");
  s += poly([P(0,0,0),P(0,FLOOR,0),P(0,FLOOR,1.6),P(0,0,1.6)], "#c7d2e3");
  [[0.4,1.3],[2.8,3.7]].forEach(w=>{
    s += poly([P(w[0],0,0.55),P(w[1],0,0.55),P(w[1],0,1.35),P(w[0],0,1.35)], "#ffffff");
    s += poly([P(w[0]+0.05,0,0.60),P(w[1]-0.05,0,0.60),P(w[1]-0.05,0,1.30),P(w[0]+0.05,0,1.30)], "#9fd7f5");
    const mid=(w[0]+w[1])/2;
    s += poly([P(mid-0.03,0,0.60),P(mid+0.03,0,0.60),P(mid+0.03,0,1.30),P(mid-0.03,0,1.30)], "#ffffff");
  });
  [[0.4,1.3],[2.8,3.7]].forEach(w=>{
    s += poly([P(0,w[0],0.55),P(0,w[1],0.55),P(0,w[1],1.35),P(0,w[0],1.35)], "#ffffff");
    s += poly([P(0,w[0]+0.05,0.60),P(0,w[1]-0.05,0.60),P(0,w[1]-0.05,1.30),P(0,w[0]+0.05,1.30)], "#8fcdf0");
    const mid=(w[0]+w[1])/2;
    s += poly([P(0,mid-0.03,0.60),P(0,mid+0.03,0.60),P(0,mid+0.03,1.30),P(0,mid-0.03,1.30)], "#ffffff");
  });
  s += poly([P(1.75,0,0.85),P(2.35,0,0.85),P(2.35,0,1.3),P(1.75,0,1.3)], "#31435f");
  s += poly([P(1.82,0,0.92),P(2.28,0,0.92),P(2.28,0,1.23),P(1.82,0,1.23)], "#e8b04e");
  s += poly([P(0,0),P(FLOOR,0),P(FLOOR,FLOOR),P(0,FLOOR)], "#0f4c5c");
  s += poly([P(0,0),P(FLOOR,0),P(FLOOR,FLOOR),P(0,FLOOR)], "#38bdf8", 'opacity="0.06"');
  let shelf = box(0.0,1.55,0.16,2.4,0.72,0.80,"#eef2f8")
    + box(0.02,1.65,0.14,1.8,0.80,1.06,"#e2574c")
    + box(0.02,1.84,0.14,1.99,0.80,1.02,"#f2c14e")
    + box(0.02,2.03,0.14,2.18,0.80,1.08,"#4f8fe8")
    + box(0.02,2.22,0.14,2.34,0.80,1.0,"#7bc47f");
  items.push({sum:1.7, svg:shelf});
  if(emps.length <= 4){
    let plant = box(1.9,1.9,2.3,2.3,0,0.30,"#c96f4a");
    const pl = P(2.10,2.10,0.30);
    plant += '<g class="sway">'
      + '<ellipse cx="'+pl[0]+'" cy="'+(pl[1]-14)+'" rx="14" ry="19" fill="#4c9a5b"/>'
      + '<ellipse cx="'+(pl[0]-9)+'" cy="'+(pl[1]-8)+'" rx="11" ry="15" fill="#63b473"/>'
      + '<ellipse cx="'+(pl[0]+9)+'" cy="'+(pl[1]-7)+'" rx="11" ry="16" fill="#3f8a4e"/>'
      + '</g>';
    items.push({sum:4.2, svg:plant});
    let cooler = box(3.82,0.14,4.08,0.40,0,0.5,"#eef2f8")
      + box(3.86,0.18,4.04,0.36,0.5,0.8,"#7cc7ee");
    items.push({sum:4.3, svg:cooler});
  }
  emps.forEach((e,i)=>{
    const sl = layout[i % layout.length];
    items.push({sum:(sl.du+0.45)+(sl.dv+0.45), svg:cluster(e, sl.du, sl.dv, i)});
  });
  items.sort((a,b)=>a.sum-b.sum).forEach(it=>{ s += it.svg; });
  emps.forEach((e,i)=>{
    const sl = layout[i % layout.length];
    s += plateOf(e, sl.pu, sl.pv);
  });
  svgEl.innerHTML = s;
}

function renderSummary(){
  let all = [];

    '<div class="chip"><span class="dot green"></span> شغال دلوقتي: '+w+'</div>'

function openPanel(id){
  const f = findEmployee(id); if(!f) return;
  const e = f.emp;
  const t = (t)=> t.map(x=>'<div class="taskrow '+(x.done?"done":"")+'"><div class="tick">'+(x.done?"✓":"")+'</div><span>'+x.text+'</span></div>').join("");
  const goalHtml = (e)=>{
    let g = e.goal;
    if(!g){ const all=(e.dailyTasks||[]).concat(e.weeklyTasks||[]);
      g={title:e.currentTask, items:all.map(x=>({text:x.text,done:x.done?1:0,total:1,unit:"خطوة"}))}; }
    const rows=g.items.map(it=>{
      const hasT = typeof it.total==="number";
      const pct = hasT ? Math.round(100*it.done/it.total) : 100;
      const lab = hasT ? ('خلص '+it.done+' من '+it.total+' - فاضل '+(it.total-it.done)) : ('خلص '+it.done+' '+(it.unit||''));
      return '<div class="goalrow"><div class="gtext">'+it.text+'</div>'+(hasT?'<div class="gbar"><i style="width:'+pct+'%;background:'+(it.done<it.total?e.accent:"#34d399")+'"></i></div>':'')+'<div class="glab">'+lab+'</div></div>';
    }).join("");
    return '<div class="sect"><h3>الهدف العام</h3><div class="nowtask">'+g.title+'</div></div><div class="sect"><h3>الأهداف الصغيرة (خلص / فاضل)</h3>'+rows+'</div>';
  };
  document.getElementById("panel").innerHTML =
    '<div class="head"><div class="avatar" style="background:'+e.accent+'">'+e.name.charAt(0)+'</div>'
    + '<div><h2>'+e.name+'</h2><div class="role">'+e.role+' - '+e.office+'</div></div>'
    + '<div class="badge '+e.status+'">'+(STATUS_AR[e.status]||e.status)+'</div></div>'
    + '<div class="sect"><h3>بيشتغل على</h3><div class="nowtask">'+e.currentTask+'</div></div>'
    + goalHtml(e)
    + '<div class="sect"><h3>قواعد الشغل</h3>'+e.rules.map(r=>'<div class="rule">'+r+'</div>').join("")+'</div>'
    + '<div class="lastdone">آخر حاجة خلّصها: '+e.lastDone+'</div>'
    + '<button class="closebtn" id="closePanel">قفل</button>';
  document.getElementById("overlay").classList.add("open");
  document.getElementById("panel").classList.add("open");
  document.getElementById("closePanel").onclick = closePanel;
}
function closePanel(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("panel").classList.remove("open");
}
document.getElementById("overlay").onclick = closePanel;
document.addEventListener("click", ev=>{
  const pgb = ev.target.closest("[data-page]");
  if(pgb){ FLOOR_PAGE = +pgb.getAttribute("data-page"); renderFloor(); return; }
  const dt = ev.target.closest("[data-dept]");
  if(dt){ FLOOR_PAGE = 0; ACTIVE_DEPT = dt.getAttribute("data-dept"); renderTabs(); renderFloor(); renderCards(); return; }
  const hit = ev.target.closest("[data-id]");
  if(hit){
    const f = findEmployee(hit.getAttribute("data-id"));
    if(f){ if(f.dept.id!==ACTIVE_DEPT){ ACTIVE_DEPT=f.dept.id; renderTabs(); renderFloor(); renderCards(); } openPanel(f.emp.id); }
  }
});

function renderAll(){ renderSummary(); renderTabs(); renderFloor(); renderCards(); }
renderAll();
/* preview helpers: ?dept=ID opens a department, #empID opens an employee, ?t=NNN freezes animations */
const qs = new URLSearchParams(location.search);
const qd = qs.get("dept");
if(qd && departments().some(d=>d.id===qd)){ ACTIVE_DEPT = qd; renderTabs(); renderFloor(); renderCards(); }
const qt = qs.get("t");
if(qt){ const st=document.createElement("style"); st.textContent="*{animation-delay:-"+parseInt(qt,10)+"ms !important}"; document.head.appendChild(st); }
const h = (location.hash||"").replace("#","");
if(h){ const f = findEmployee(h); if(f){ ACTIVE_DEPT=f.dept.id; renderTabs(); renderFloor(); renderCards(); openPanel(f.emp.id); } }
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
fetch("status.json", {cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ if(d && (d.departments || d.employees)){ DATA=d; renderAll(); } }).catch(()=>{});
</script>
</body>
</html>
